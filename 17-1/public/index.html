<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>지하철 호선별 승하차인원</title>

  <link rel="stylesheet" href="./subway.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>지하철 호선별 승하차인원</h1>
      <p class="student">본인학번_신미령</p>
    </header>

    <p>
      날짜와 호선을 선택하면 역별 승차·하차 인원을 조회합니다.
    </p>

    <form id="subwayForm">
      <label for="date">날짜:</label>
      <input
        type="date"
        id="date"
        name="date"
        value="2024-08-03"
        required
      >

      <label for="line">호선:</label>
      <select id="line" name="line">
        <option value="1호선">1호선</option>
        <option value="2호선">2호선</option>
        <option value="3호선" selected>3호선</option>
        <option value="4호선">4호선</option>
        <option value="5호선">5호선</option>
        <option value="6호선">6호선</option>
        <option value="7호선">7호선</option>
        <option value="8호선">8호선</option>
        <option value="9호선">9호선</option>
        <option value="전체">전체</option>
      </select>

      <button type="submit" id="searchButton">
        호선별 승하차인원 조회
      </button>
    </form>

    <p id="status" role="status" aria-live="polite">
      날짜와 호선을 선택한 뒤 조회 버튼을 누르세요.
    </p>

    <p id="summary"></p>

    <p>
      <a id="jsonLink" target="_blank" rel="noopener" hidden>
        같은 날짜의 함수 JSON 응답 보기
      </a>
    </p>

    <div id="subway"></div>
  </main>
</body>
</html>
